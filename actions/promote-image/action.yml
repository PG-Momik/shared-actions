name: 'Promote Image'
description: 'Copies an image from the staging ECR registry to the production one with the same digest'

inputs:
  source-registry:
    description: 'Registry to copy from, such as 123456789012.dkr.ecr.us-east-1.amazonaws.com'
    required: true
  target-registry:
    description: 'Registry to copy to'
    required: true
  repository:
    description: 'ECR repository name (same in both registries)'
    required: true
  source-tag:
    description: 'Existing image tag to copy'
    required: false
    default: ${{ github.sha }}
  target-tags:
    description: 'Comma separated tags to write in the target registry'
    required: false
    default: ${{ github.sha }},${{ github.ref_name }}
  region:
    description: 'AWS region (when empty, your own AWS config is used)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install crane
      uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
    - name: Copy the staging image to the target registry
      shell: bash
      env:
        SOURCE_REGISTRY: ${{ inputs.source-registry }}
        TARGET_REGISTRY: ${{ inputs.target-registry }}
        REPOSITORY: ${{ inputs.repository }}
        SOURCE_TAG: ${{ inputs.source-tag }}
        TARGET_TAGS: ${{ inputs.target-tags }}
        REGION: ${{ inputs.region }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/promote.sh"
