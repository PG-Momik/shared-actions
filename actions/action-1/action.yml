name: '[Updated] Action 1'

inputs:
  use-master:
    required: false
    default: 'false'
  default-environment:
    required: false
    default: 'dev'
  trunk-based:
    required: false
    default: 'false'
  version-scheme:
    required: false
    default: 'calver'

outputs:
  environment:
    value: ${{ steps.resolve.outputs.environment }}
  release-branch:
    value: ${{ steps.resolve.outputs.release-branch }}

runs:
  using: 'composite'
  steps:
    - name: Dummy step 1
      id: resolve
      shell: bash
      env:
        USE_MASTER: ${{ inputs.use-master }}
        DEFAULT_ENVIRONMENT: ${{ inputs.default-environment }}
        TRUNK_BASED: ${{ inputs.trunk-based }}
        VERSION_SCHEME: ${{ inputs.version-scheme }}
        GIT_REF: ${{ github.ref }}
      run: bash "$GITHUB_ACTION_PATH/resolve.sh"
